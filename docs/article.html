<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品详情 · 孙澍垚</title>
<style>
  :root {
    --bg: #FBF9F5;
    --fg: #1A1A1A;
    --muted: #6B6B6B;
    --accent: #C5513B;
    --hairline: #E8E5DF;
    --card-bg: #FFFFFF;
    --font-sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
    --max-width: 720px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.75;
  }

  /* ── Nav ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(251, 249, 245, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--hairline);
  }
  nav .nav-inner {
    max-width: 960px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px;
  }
  nav .nav-name { font-weight: 600; font-size: 15px; letter-spacing: 0.03em; }
  nav .nav-links { display: flex; gap: 28px; }
  nav .nav-links a {
    text-decoration: none; color: var(--muted); font-size: 13px;
    transition: color 0.2s;
  }
  nav .nav-links a:hover { color: var(--fg); }

  /* ── Article ── */
  .article { max-width: var(--max-width); margin: 0 auto; padding: 140px 24px 80px; }

  .back-link {
    display: inline-block; font-size: 13px; color: var(--muted);
    text-decoration: none; margin-bottom: 32px; transition: color 0.2s;
  }
  .back-link:hover { color: var(--fg); }

  .art-platform {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--accent); margin-bottom: 8px;
  }
  .art-date { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .art-title {
    font-size: 28px; font-weight: 700; line-height: 1.35;
    margin-bottom: 12px;
  }
  .art-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
  .art-tags span {
    font-size: 11px; font-weight: 500; color: var(--muted);
    border: 0.5px solid var(--hairline); padding: 3px 10px; border-radius: 3px;
  }

  /* ── Content blocks ── */
  .content-block { margin-bottom: 36px; }
  .content-block h3 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    color: var(--accent); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 0.5px solid var(--hairline);
  }
  .content-block p {
    font-size: 16px; line-height: 1.9; margin-bottom: 16px;
    font-family: var(--font-serif);
  }
  .content-block blockquote {
    margin: 16px 0; padding: 16px 20px;
    border-left: 2px solid var(--accent);
    background: rgba(197, 81, 59, 0.03);
    font-size: 14px; color: var(--muted); line-height: 1.7;
  }
  .content-block .intro-text {
    font-size: 13px; color: var(--muted); line-height: 1.8;
    margin-bottom: 32px; font-family: var(--font-sans);
  }
  .content-block .sub-heading {
    display: block; font-size: 15px; font-weight: 700;
    font-family: var(--font-sans); color: var(--fg);
    margin: 28px 0 8px;
  }
  .content-block .source-link {
    font-size: 13px; color: var(--muted);
  }
  .content-block .source-link a {
    color: var(--accent); text-decoration: none;
  }
  .content-block .source-link a:hover { text-decoration: underline; }

  /* ── Video script metadata ── */
  .art-meta-row {
    margin-bottom: 28px; padding: 16px 20px;
    background: rgba(0,0,0,0.02); border-radius: 4px;
    border: 0.5px solid var(--hairline);
  }
  .art-meta-row .meta-item {
    font-size: 13px; line-height: 1.7; color: var(--muted);
  }
  .art-meta-row .meta-item + .meta-item { margin-top: 8px; }
  .art-meta-row .meta-label {
    font-weight: 600; font-size: 11px; letter-spacing: 0.05em;
    color: var(--accent); margin-right: 6px;
  }

  /* ── Divider between news and commentary ── */
  .section-divider {
    width: 40px; height: 1px; background: var(--accent);
    margin: 36px 0; opacity: 0.4;
  }

  /* ── Footer ── */
  footer {
    border-top: 0.5px solid var(--hairline); padding: 40px 0; margin-top: 40px;
  }
  footer .footer-inner {
    max-width: var(--max-width); margin: 0 auto; padding: 0 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  footer .footer-text { font-size: 13px; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .article { padding: 120px 16px 60px; }
    .art-title { font-size: 22px; }
    nav .nav-links { gap: 16px; }
  }
  .content-block figure { margin: 28px 0; }
  .content-block img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 4px; }
  .content-block figcaption { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
  .content-block h2 { font-size: 22px; margin: 48px 0 20px; scroll-margin-top: 90px; }
  .article-toc { padding: 20px 24px; border: 1px solid var(--hairline); margin-bottom: 36px; font-size: 14px; }
  .article-toc ol { padding-left: 20px; margin-top: 8px; }
  .article-toc a { color: var(--muted); text-decoration: none; }
  .article-toc a:hover { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .content-block .article-lead { padding: 22px 24px; margin: 8px 0 32px; border-left: 3px solid var(--accent); background: rgba(197,81,59,.055); color: var(--fg); font-size: 17px; font-weight: 600; line-height: 1.85; }
  .content-block .chapter-heading { color: var(--accent); font-size: 30px; letter-spacing: .04em; border-bottom: 1px solid var(--hairline); padding-bottom: 10px; margin-top: 44px; }

.content-block .reading-note {font-size:13px;line-height:1.7;color:#888;margin:12px 0 28px;}
.content-block .profile-intro {background:#F3F1ED;border-left:3px solid #C7B9A9;padding:22px 26px;margin:12px 0 36px;}
.content-block .profile-intro h3 {font-size:14px;letter-spacing:.12em;color:#7B6A59;margin:0 0 14px;}
.content-block .profile-intro p {font-size:14px;line-height:1.9;color:#666;margin:0 0 12px;}
.content-block .profile-intro p:last-child {margin-bottom:0;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-name">孙澍垚</div>
    <div class="nav-links">
      <a href="index.html">作品</a>
      <a href="about.html">关于</a>
      <a href="resume.html">简历</a>
    </div>
  </div>
</nav>

<article class="article" id="articleContent">
  <!-- Filled by JS -->
</article>

<footer>
  <div class="footer-inner">
    <span class="footer-text">&copy; 2026 孙澍垚</span>
    <span><a href="mailto:cloudyssy@163.com">cloudyssy@163.com</a></span>
  </div>
</footer>

<script src="articles-data.js"></script>
<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const article = ARTICLES[id];

    if (!article) {
      document.getElementById('articleContent').innerHTML = '<p style="color:var(--muted);text-align:center;padding:60px 0;">文章未找到 · <a href="index.html">返回作品集</a></p>';
      document.title = '未找到 · 孙澍垚';
      return;
    }

    document.title = article.title + ' · 孙澍垚';

    let html = '';

    // Back link
    html += '<a href="index.html" class="back-link">← 作品集</a>';

    // Metadata
    html += '<div class="art-platform">' + escapeHtml(article.platform) + '</div>';
    if (article.date || article.dateNote) html += '<div class="art-date">' + escapeHtml([article.date, article.dateNote].filter(Boolean).join(' · ')) + '</div>';
    html += '<h1 class="art-title">' + escapeHtml(article.title) + '</h1>';

    // Tags
    if (article.tags && article.tags.length) {
      html += '<div class="art-tags">';
      article.tags.forEach(t => { html += '<span>' + escapeHtml(t) + '</span>'; });
      html += '</div>';
    }

    // Editor's note
    if (article.editorNote) {
      html += '<div class="content-block"><blockquote>' + escapeHtml(article.editorNote) + '</blockquote></div>';
    }

    if (article.sections && article.sections.length) {
      html += '<div class="article-toc" aria-label="文章目录"><strong>本文目录</strong><ol>';
      article.sections.forEach(section => {
        html += '<li><a href="#' + escapeHtml(section.id) + '">' + escapeHtml(section.title) + '</a></li>';
      });
      html += '</ol></div>';
    }

    // News summary
    if (article.news) {
      html += '<div class="content-block"><h3>新闻背景</h3>';
      const paragraphs = article.news.split('\n\n');
      paragraphs.forEach(p => {
        const trimmed = p.trim();
        if (trimmed) html += '<p>' + escapeHtml(trimmed) + '</p>';
      });
      html += '</div>';
    }

    // Source link
    if (article.sourceUrl) {
      html += '<div class="content-block"><div class="source-link">新闻来源：<a href="' + escapeHtml(article.sourceUrl) + '" target="_blank" rel="noopener">' + escapeHtml(article.sourceLabel || article.sourceUrl) + '</a></div></div>';
    }

    // Divider
    if ((article.news || article.sourceUrl) && article.commentary) {
      html += '<div class="section-divider"></div>';
    }

    // Commentary
    if (article.commentary) {
      html += '<div class="content-block"><h3>点评</h3>';
      const cParagraphs = article.commentary.split('\n\n');
      cParagraphs.forEach(p => {
        const trimmed = p.trim();
        if (trimmed) html += '<p>' + escapeHtml(trimmed) + '</p>';
      });
      html += '</div>';
    }

    // Full body for non-吴晓波频道 formats
    if (article.body) {
      var bodyText = article.body;
      var metaHtml = '';
      var displayBody = bodyText;

      // Parse 封面标题/标题/发布文案/文案/核心观点 from body
      var coverTitle = '', publishCopy = '', corePoint = '';
      var metaLabel1 = '封面标题', metaLabel2 = '发布文案';

      // 李稻葵 format: 封面标题：XXX, 发布文案：XXX
      var ctMatch = bodyText.match(/^封面标题[：:]\s*(.+?)(?:\n|\\n)/);
      if (ctMatch) { coverTitle = ctMatch[1].trim(); }

      var pcMatch = bodyText.match(/发布文案[：:]\s*(.+?)(?:\n|\\n)/);
      if (pcMatch) { publishCopy = pcMatch[1].trim(); }

      // 楠哥 format: 标题：XXX, 文案：XXX (or 发布文案：XXX)
      if (!coverTitle) {
        var tMatch = bodyText.match(/^标题[：:]\s*(.+?)(?:\n|\\n)/);
        if (tMatch) { coverTitle = tMatch[1].trim(); metaLabel1 = '标题'; }
      }
      if (!publishCopy) {
        var pmMatch = bodyText.match(/^文案[：:]\s*(.+?)(?:\n|\\n)/);
        if (pmMatch) { publishCopy = pmMatch[1].trim(); metaLabel2 = '文案'; }
      }

      // 核心观点前置 (in brackets)
      var cpMatch = bodyText.match(/【核心观点[^】]*】\s*([\s\S]*?)(?=建议角度[：:]|参考观点[：:]|\n\n\d+[、.]|\n\n首先)/);
      if (!cpMatch) cpMatch = bodyText.match(/【核心观点[^】]*】\s*(.+?)(?=\\n\\n)/);
      if (cpMatch) { corePoint = cpMatch[1].trim(); }

      if (coverTitle || publishCopy || corePoint) {
        metaHtml += '<div class="art-meta-row">';
        if (coverTitle) {
          metaHtml += '<div class="meta-item"><span class="meta-label">' + escapeHtml(metaLabel1) + '</span>' + escapeHtml(coverTitle) + '</div>';
        }
        if (publishCopy) {
          metaHtml += '<div class="meta-item"><span class="meta-label">' + escapeHtml(metaLabel2) + '</span>' + escapeHtml(publishCopy) + '</div>';
        }
        if (corePoint) {
          metaHtml += '<div class="meta-item"><span class="meta-label">核心观点</span>' + escapeHtml(corePoint) + '</div>';
        }
        metaHtml += '</div>';

        // Remove metadata lines from body text (including trailing newline)
        displayBody = bodyText
          .replace(/^封面标题[：:][^\\n]*(?:\\n)?/, '')
          .replace(/^标题[：:][^\\n]*(?:\\n)?/, '')
          .replace(/^[\\n\\xa0]+/, '')  // strip leading whitespace/newlines
          .replace(/^发布文案[：:][^\\n]*(?:\\n)?/, '')
          .replace(/^文案[：:][^\\n]*(?:\\n)?/, '')
          .replace(/^[\\n\\xa0]+/, '')  // strip leading whitespace again
          .replace(/【核心观点[^】]*】[\s\S]*?(?=建议角度[：:]|参考观点[：:]|\n\n\d+[、.]|\n\n首先)/, '')
          .replace(/^\\n+/, '');
      }

      html += metaHtml;

      // Body is pre-rendered HTML — render directly
      html += '<div class="content-block">';
      html += displayBody.replace(/\\n/g, '\n');  // Convert \n escapes to real newlines for HTML
      html += '</div>';
    }

    html += '<a href="works.html' + (id === 'lab42-ai-history' ? '#col-lab42' : '#works') + '" class="back-link">← 浏览全部作品</a>';
    document.getElementById('articleContent').innerHTML = html;
  })();

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
